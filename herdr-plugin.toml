id = "the-inconvenience-store.herdr-agent-session-title"
name = "Agent Session Title"
version = "0.10.0"
min_herdr_version = "0.7.0"
description = "Uses Claude Code, Codex, OMP, and Hermes session titles as herdr agent names"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/integrations.sh", "install"]

[[actions]]
id = "install"
title = "Install or repair detected agent integrations"
contexts = ["workspace"]
command = ["sh", "scripts/integrations.sh", "install"]

[[actions]]
id = "status"
title = "Show detected agent integration status"
contexts = ["workspace"]
command = ["sh", "scripts/integrations.sh", "status"]

[[actions]]
id = "uninstall"
title = "Uninstall detected agent integrations"
contexts = ["workspace"]
command = ["sh", "scripts/integrations.sh", "uninstall"]
