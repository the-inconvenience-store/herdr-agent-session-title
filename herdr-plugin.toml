id = "bcihanc.claude-session-title"
name = "Agent Session Title"
version = "0.2.0"
min_herdr_version = "0.7.0"
description = "Reports Claude Code and Codex session titles as herdr pane metadata"
platforms = ["linux", "macos"]

[[actions]]
id = "install"
title = "Install Claude Code hook"
contexts = ["workspace"]
command = ["sh", "scripts/install.sh"]

[[actions]]
id = "uninstall"
title = "Uninstall Claude Code hook"
contexts = ["workspace"]
command = ["sh", "scripts/uninstall.sh"]

[[actions]]
id = "status"
title = "Show hook installation status"
contexts = ["workspace"]
command = ["sh", "scripts/status.sh"]

[[actions]]
id = "install-codex"
title = "Install Codex notification integration"
contexts = ["workspace"]
command = ["sh", "scripts/install-codex.sh"]

[[actions]]
id = "uninstall-codex"
title = "Uninstall Codex notification integration"
contexts = ["workspace"]
command = ["sh", "scripts/uninstall-codex.sh"]

[[actions]]
id = "status-codex"
title = "Show Codex integration status"
contexts = ["workspace"]
command = ["sh", "scripts/status-codex.sh"]
